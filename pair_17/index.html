<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script src="script.js"></script>
<script src="style.css"></script>

<main class="card">
    <p class = "brand">COMMUNITY</p>
    <h1>Створити акаунт</h1>
    <p class="subtitle">Приєднуйся до нас</p>
    <form id="register_form" novalidate>
        <div class="field">
            <label>Ім'я користувача</label>
            <input type="text" id="username" placeholder="Наприклад, Бобік">
             <small id="username_error" class="error"></small>
        </div>

        <div class="field">
            <label>Електронна пошта</label>
            <input type="email" id="email" placeholder="name@example.com">
            <small id="email_error" class="error"></small>
        </div>

        <div class="field">
            <label>Пароль</label>
            <div class="password_row">
                <input id="password" type="password" placeholder="Мінімум 8 символів">
                <button id="toggle_password" class="toggle" type = button>&#x1F441;</button>
            </div>
            <small id="password_error" class="error"></small>
            <div class = "strength_track"><div class="strength_bar"></div></div>
            <small id="strength_text">Надійність пароля</small>
        </div>

         <div class="field">
             <label>Повторіть пароль</label>
             <input id="confirm_password" type="password" placeholder="введіть пароль ще раз">
             <small id="confirm_error" class="error"></small>
         </div>
        <div class="field">
            <label class="terms"><input id="terms" type="checkbox">Погоджуюсь з супер умовами</label>
            <small id="terms_error" class="error"></small>
        </div>
        <button class="submit" type="submit">Зареєструватися</button>
        <p id="result"></p>
    </form>

</main>
</body>
</html>
